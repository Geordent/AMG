<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 136" preserveAspectRatio="xMaxYMid slice" role="img" aria-label="Путешествуем по Грузии">
  <title>Путешествуем по Грузии</title>
  <desc>Горы, дорога, автодом и воздушный шар.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A3B22"/>
      <stop offset=".55" stop-color="#CE6A44"/>
      <stop offset="1" stop-color="#E99A6C"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9C6AA"/>
      <stop offset="1" stop-color="#D9AE8C"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D9C2"/>
      <stop offset="1" stop-color="#E8C0A0"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF0DF"/>
      <stop offset="1" stop-color="#E7CDB0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D35A"/>
      <stop offset="1" stop-color="#D99A16"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="640" height="136" fill="url(#sky)"/>
  <circle cx="520" cy="28" r="22" fill="url(#gold)" opacity=".95"/>
  <circle cx="520" cy="28" r="34" fill="#F7D35A" opacity=".14" filter="url(#soft)"/>
  <path d="M0 96 L64 66 L118 92 L184 44 L246 86 L318 58 L382 94 L452 52 L524 90 L588 64 L640 82 L640 136 L0 136Z" fill="url(#far)" opacity=".85"/>
  <path d="M0 110 L80 84 L148 108 L220 74 L292 106 L364 82 L436 112 L512 80 L582 108 L640 94 L640 136 L0 136Z" fill="url(#mid)" opacity=".9"/>
  <path d="M0 120 L88 104 L164 120 L246 98 L330 122 L420 102 L510 124 L590 108 L640 118 L640 136 L0 136Z" fill="url(#near)"/>
  <path d="M0 124 H640 V136 H0Z" fill="#44382F"/>
  <path d="M0 129 H640" stroke="#FBF3DC" stroke-width="2.2" stroke-dasharray="14 12"/>
  <path d="M250 120 C330 108 402 104 528 106" fill="none" stroke="#FBF3DC" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 9" opacity=".7"/>

  <!-- автодом -->
  <g transform="translate(500 86) scale(.95)" stroke="#3B332B" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="40" cy="34" rx="44" ry="5" fill="#2B2420" opacity=".2"/>
    <path d="M2 28 V10 C2 5 6 2 12 2 H54 C60 2 64 4 68 8 L82 22 C85 25 87 29 87 33 V38 H2Z" fill="#FBF3DC"/>
    <path d="M2 26 H87 V34 H2Z" fill="#B8482A"/>
    <rect x="10" y="8" width="17" height="12" rx="2" fill="#BFE3F2"/>
    <rect x="32" y="8" width="17" height="12" rx="2" fill="#BFE3F2"/>
    <path d="M56 8 L68 21 H51 V8Z" fill="#BFE3F2"/>
    <path d="M52 6 V28" fill="none"/>
    <path d="M14 2 H44" fill="none"/>
    <rect x="16" y="-5" width="24" height="8" rx="2" fill="#E6B422"/>
    <circle cx="24" cy="37" r="8" fill="#2B2420"/><circle cx="24" cy="37" r="3" fill="#FBF3DC" stroke="none"/>
    <circle cx="68" cy="37" r="8" fill="#2B2420"/><circle cx="68" cy="37" r="3" fill="#FBF3DC" stroke="none"/>
    <circle cx="86" cy="28" r="2" fill="#E6B422" stroke="none"/>
  </g>

  <!-- воздушный шар -->
  <g transform="translate(598 20) scale(.66)" stroke="#3B332B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 -40 C-22 -40 -35 -24 -35 -6 C-35 12 -22 26 -10 36 L10 36 C22 26 35 12 35 -6 C35 -24 22 -40 0 -40Z" fill="#B8482A"/>
    <path d="M0 -40 C-12 -30 -12 12 -10 36 L10 36 C12 12 12 -30 0 -40Z" fill="#F3D9CF"/>
    <path d="M-22 -25 C-8 -10 -8 26 -10 36 M22 -25 C8 -10 8 26 10 36" fill="none" stroke="#8F3724" stroke-width="1.6" opacity=".7"/>
    <path d="M-10 36 L-7 48 M10 36 L7 48" fill="none"/>
    <rect x="-9" y="48" width="18" height="12" rx="2" fill="#8A5A3B"/>
    <path d="M-9 51 H9" stroke="#E6B422" stroke-width="2"/>
  </g>

  <!-- птицы и передний план -->
  <g fill="none" stroke="#FBF3DC" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M300 30 q8 -7 16 0 q8 -7 16 0"/>
    <path d="M356 52 q6 -6 12 0 q6 -6 12 0"/>
  </g>
  <path d="M0 136 L0 128 C24 124 44 126 68 130 L68 136Z" fill="#5B4A3D" opacity=".55"/>
  <rect width="640" height="136" filter="url(#grain)" opacity=".45" style="mix-blend-mode:multiply"/>
</svg>
