<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Сабуртало: советская мозаика и муралы">
  <title>Сабуртало: советская мозаика и муралы</title>
  <desc>Панельный дом с большой мозаикой-солнцем, деревья и улица Сабуртало.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE3E6"/>
      <stop offset=".7" stop-color="#EDE6D7"/>
      <stop offset="1" stop-color="#F7EDDF"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0E1CA"/>
      <stop offset=".58" stop-color="#E2CCB0"/>
      <stop offset="1" stop-color="#C9AE8E"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B99A78"/>
      <stop offset="1" stop-color="#8F7257"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B79D"/>
      <stop offset="1" stop-color="#A98E70"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="2" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="640" height="280" fill="url(#sky)"/>
  <circle cx="522" cy="58" r="28" fill="#F3C44B" opacity=".9"/>
  <circle cx="522" cy="58" r="46" fill="#F3C44B" opacity=".16"/>
  <path d="M0 172 C92 150 172 164 256 154 C348 143 430 160 520 150 C572 144 612 152 640 148 L640 280 L0 280Z" fill="#DCE0D0" opacity=".7"/>

  <!-- панельный дом -->
  <g>
    <path d="M112 58 L520 42 L540 226 L132 244Z" fill="url(#facade)" stroke="#3B332B" stroke-width="4"/>
    <path d="M520 42 L570 56 L582 232 L540 226Z" fill="url(#side)" stroke="#3B332B" stroke-width="4"/>
    <path d="M112 58 L520 42 L520 54 L112 70Z" fill="#FFFBF5" opacity=".35"/>
    <path d="M132 244 L540 226 L540 244 L132 262Z" fill="#8F7257" opacity=".55"/>
    <!-- швы панелей -->
    <g stroke="#B08F6C" stroke-width="2" opacity=".7">
      <path d="M112 118 L522 102 M112 176 L530 160 M244 54 L254 242 M374 49 L382 236 M470 46 L476 232"/>
    </g>
    <!-- мозаика -->
    <g>
      <rect x="166" y="70" width="274" height="86" rx="4" fill="#E9DCC7" stroke="#4A3A2A" stroke-width="4"/>
      <g stroke="#9B8A72" stroke-width="1.2">
        <path d="M170 82 H436 M170 94 H436 M170 106 H436 M170 118 H436 M170 130 H436 M170 142 H436"/>
        <path d="M180 72 V154 M194 72 V154 M208 72 V154 M222 72 V154 M236 72 V154 M250 72 V154 M264 72 V154 M278 72 V154 M292 72 V154 M306 72 V154 M320 72 V154 M334 72 V154 M348 72 V154 M362 72 V154 M376 72 V154 M390 72 V154 M404 72 V154 M418 72 V154 M432 72 V154"/>
      </g>
      <!-- солнечный узор -->
      <g stroke="#7A5A38" stroke-width="1.4" stroke-linejoin="round">
        <path d="M244 86 L258 86 L266 98 L282 94 L296 106 L296 122 L282 130 L266 126 L250 134 L238 122 L238 102Z" fill="#E6A72B"/>
        <path d="M254 98 L272 98 L280 110 L274 122 L258 124 L248 112Z" fill="#B8482A"/>
        <path d="M264 106 L272 110 L268 118 L258 116Z" fill="#F3C44B"/>
        <path d="M300 84 L314 84 L320 96 L314 108 L300 108 L294 96Z" fill="#2F6FB0"/>
        <path d="M330 122 L344 122 L350 134 L344 146 L330 146 L324 134Z" fill="#2F8F6B"/>
        <path d="M376 88 L390 88 L396 100 L390 112 L376 112 L370 100Z" fill="#B8482A"/>
        <path d="M404 118 L416 118 L422 128 L416 140 L404 140 L398 128Z" fill="#E6A72B"/>
        <path d="M216 126 L228 126 L234 136 L228 146 L216 146 L210 136Z" fill="#2F6FB0"/>
        <path d="M360 72 L372 72 L378 82 L372 92 L360 92 L354 82Z" fill="#2F8F6B"/>
        <path d="M188 86 L198 86 L202 96 L198 106 L188 106 L184 96Z" fill="#7E57C2"/>
      </g>
      <!-- потёртости и швы -->
      <g fill="#F7EDDF" opacity=".35">
        <rect x="168" y="70" width="6" height="86"/><rect x="430" y="70" width="8" height="86"/>
      </g>
      <path d="M186 150 C196 146 202 150 202 156 L186 158Z" fill="#8F7257" opacity=".55"/>
    </g>
    <!-- окна и балконы -->
    <g fill="#BFE3E2" stroke="#3B332B" stroke-width="3">
      <rect x="160" y="176" width="42" height="34" rx="2"/>
      <rect x="222" y="174" width="42" height="34" rx="2"/>
      <rect x="292" y="172" width="42" height="34" rx="2"/>
      <rect x="362" y="170" width="42" height="34" rx="2"/>
      <rect x="432" y="168" width="42" height="34" rx="2"/>
    </g>
    <g fill="#FFFBF5" opacity=".28">
      <rect x="164" y="180" width="8" height="26"/><rect x="226" y="178" width="8" height="26"/><rect x="296" y="176" width="8" height="26"/>
    </g>
    <g fill="#6E4A2E" opacity=".85">
      <rect x="150" y="214" width="340" height="8" rx="2"/>
      <path d="M168 222 V240 M196 222 V240 M314 222 V240 M342 222 V240 M448 222 V240 M476 222 V240" stroke="#3B332B" stroke-width="2.2"/>
    </g>
  </g>

  <!-- деревья и дорога -->
  <g>
    <path d="M42 280 L42 206 C52 186 62 180 72 188 L72 280Z" fill="#6E4A2E"/>
    <path d="M72 188 C108 152 152 160 168 190 C184 218 156 244 122 246 C86 248 62 226 72 188Z" fill="#5C7A4A"/>
    <path d="M88 192 C112 172 142 176 154 194 C166 212 148 230 126 232 C100 234 82 216 88 192Z" fill="#74925C"/>
    <path d="M560 280 L560 208 C570 188 580 182 590 190 L590 280Z" fill="#6E4A2E"/>
    <path d="M590 190 C622 158 660 166 674 194 L674 280 L590 280Z" fill="#557447"/>
    <path d="M0 248 L640 232 L640 280 L0 280Z" fill="url(#road)"/>
    <path d="M0 248 L640 232" stroke="#8E7358" stroke-width="3"/>
    <path d="M20 280 L52 250 M108 280 L128 247 M196 280 L206 245 M284 280 L284 243 M372 280 L360 241 M460 280 L438 240 M548 280 L516 238 M624 280 L592 237" stroke="#B79B7C" stroke-width="2" opacity=".5"/>
    <ellipse cx="132" cy="266" rx="54" ry="8" fill="#3B332B" opacity=".13" filter="url(#soft)"/>
    <ellipse cx="580" cy="256" rx="60" ry="8" fill="#3B332B" opacity=".13" filter="url(#soft)"/>
  </g>

  <!-- человек и детали -->
  <g fill="#3A3028" opacity=".8">
    <circle cx="486" cy="234" r="4.2"/><path d="M481 240 C481 249 482 256 482 266 L488 266 C488 256 489 249 489 240 C486 237 484 237 481 240Z"/>
    <path d="M482 244 L475 254 L477 256 L483 248 M488 244 L495 254 L493 256 L487 248" fill="none" stroke="#3A3028" stroke-width="2.5"/>
  </g>
  <g fill="none" stroke="#3B332B" stroke-width="1.8" stroke-linecap="round" opacity=".6">
    <path d="M300 44 q4 -5 8 0 q4 -5 8 0"/>
    <path d="M340 34 q4 -5 8 0 q4 -5 8 0"/>
  </g>
  <rect width="640" height="280" filter="url(#grain)" opacity=".5" style="mix-blend-mode:multiply"/>
</svg>
