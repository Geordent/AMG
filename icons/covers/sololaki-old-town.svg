      <stop offset="0" stop-color="#F9E7C6"/>
      <stop offset=".55" stop-color="#F3D6BE"/>
      <stop offset="1" stop-color="#EBC3A4"/>
    </linearGradient>
    <linearGradient id="wallLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D19B"/>
      <stop offset=".62" stop-color="#DFB87D"/>
      <stop offset="1" stop-color="#C9975D"/>
    </linearGradient>
    <linearGradient id="wallRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D99A84"/>
      <stop offset=".58" stop-color="#C87962"/>
      <stop offset="1" stop-color="#A95443"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A9297"/>
      <stop offset=".55" stop-color="#1F6F78"/>
      <stop offset="1" stop-color="#15545C"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D3C1A7"/>
      <stop offset="1" stop-color="#A98E70"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE4A6"/>
      <stop offset=".7" stop-color="#F2C46A"/>
      <stop offset="1" stop-color="#C9893F"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
    </filter>
    <pattern id="lace" x="0" y="0" width="26" height="32" patternUnits="userSpaceOnUse">
