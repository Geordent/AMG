<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Сололаки: старый город, резные балконы и площадь Свободы">
  <title>Сололаки: старый город</title>
  <desc>Тбилисские дома с резными деревянными балконами, виноград, улица к площади Свободы и колонна Святого Георгия.</desc>
  <defs>
