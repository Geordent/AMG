<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Варкетили: музей под открытым небом">
  <title>Варкетили: музей под открытым небом</title>
  <desc>Панельные дома Варкетили с муралами, улица, деревья и люди.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE3E6"/>
      <stop offset=".68" stop-color="#EDE6D7"/>
      <stop offset="1" stop-color="#F7EDDF"/>
    </linearGradient>
    <linearGradient id="wall1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0E1CA"/>
      <stop offset=".62" stop-color="#E2CCB0"/>
      <stop offset="1" stop-color="#C9AE8E"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D7BE"/>
      <stop offset=".6" stop-color="#D8BF9F"/>
      <stop offset="1" stop-color="#BE9F7C"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B79D"/>
      <stop offset="1" stop-color="#A98E70"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="2" seed="31" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="640" height="280" fill="url(#sky)"/>
  <circle cx="82" cy="58" r="26" fill="#F3C44B" opacity=".9"/>
  <circle cx="82" cy="58" r="44" fill="#F3C44B" opacity=".14"/>
  <path d="M0 172 C92 150 172 164 256 154 C348 143 430 160 520 150 C572 144 612 152 640 148 L640 280 L0 280Z" fill="#DCE0D0" opacity=".7"/>

  <!-- левый дом -->
  <g>
    <rect x="-10" y="54" width="216" height="206" fill="url(#wall1)" stroke="#3B332B" stroke-width="4"/>
    <path d="M-10 54 H206 V66 H-10Z" fill="#FFFBF5" opacity=".35"/>
    <g stroke="#B08F6C" stroke-width="2" opacity=".65">
      <path d="M-10 112 H206 M-10 170 H206 M64 54 V260 M136 54 V260"/>
    </g>
    <!-- мурал-мишень -->
    <rect x="24" y="76" width="92" height="132" rx="3" fill="#A9472B" stroke="#4A3A2A" stroke-width="3"/>
    <circle cx="70" cy="140" r="42" fill="#E6B422" stroke="#4A3A2A" stroke-width="3"/>
    <circle cx="70" cy="140" r="30" fill="#F3D9CF" stroke="#4A3A2A" stroke-width="2.4"/>
    <circle cx="70" cy="140" r="17" fill="#E6B422" stroke="#4A3A2A" stroke-width="2.4"/>
    <circle cx="70" cy="140" r="7" fill="#B8482A" stroke="#4A3A2A" stroke-width="2"/>
    <g fill="#BFE3E2" stroke="#3B332B" stroke-width="2.6">
      <rect x="136" y="88" width="24" height="20"/><rect x="168" y="88" width="24" height="20"/>
      <rect x="136" y="120" width="24" height="20"/><rect x="168" y="120" width="24" height="20"/>
      <rect x="136" y="152" width="24" height="20"/><rect x="168" y="152" width="24" height="20"/>
      <rect x="136" y="184" width="24" height="20"/><rect x="168" y="184" width="24" height="20"/>
    </g>
  </g>

  <!-- средний дом -->
  <g>
    <path d="M212 46 L422 58 L422 260 L212 260Z" fill="url(#wall2)" stroke="#3B332B" stroke-width="4"/>
    <path d="M212 46 L422 58 L422 70 L212 58Z" fill="#FFFBF5" opacity=".3"/>
    <g stroke="#A98764" stroke-width="2" opacity=".6">
      <path d="M212 108 H422 M212 166 H422 M282 49 V260 M352 54 V260"/>
    </g>
    <!-- мурал-птица -->
    <rect x="238" y="72" width="118" height="150" rx="3" fill="#1F6F78" stroke="#4A3A2A" stroke-width="3"/>
    <path d="M292 196 C286 176 288 152 300 136 C310 122 326 122 334 136 C340 148 336 160 328 170 C322 178 318 186 320 196Z" fill="#E6B422" stroke="#4A3A2A" stroke-width="2.6"/>
    <circle cx="318" cy="132" r="9" fill="#E6B422" stroke="#4A3A2A" stroke-width="2.4"/>
    <circle cx="321" cy="130" r="2" fill="#3B332B"/>
    <path d="M326 132 L340 128 L328 138Z" fill="#B8482A" stroke="#4A3A2A" stroke-width="1.8"/>
    <path d="M300 152 L280 142 L296 166Z" fill="#A9472B" stroke="#4A3A2A" stroke-width="2"/>
    <path d="M308 190 L304 202 M322 190 L326 202" stroke="#4A3A2A" stroke-width="2.4"/>
    <g fill="#BFE3E2" stroke="#3B332B" stroke-width="2.6">
      <rect x="372" y="84" width="24" height="20"/><rect x="372" y="116" width="24" height="20"/>
      <rect x="372" y="148" width="24" height="20"/><rect x="372" y="180" width="24" height="20"/>
    </g>
  </g>

  <!-- правый дом -->
  <g>
    <rect x="422" y="70" width="228" height="190" fill="url(#wall1)" stroke="#3B332B" stroke-width="4"/>
    <path d="M422 70 H650 V82 H422Z" fill="#FFFBF5" opacity=".32"/>
    <g stroke="#B08F6C" stroke-width="2" opacity=".62">
      <path d="M422 126 H650 M422 182 H650 M492 70 V260 M562 70 V260"/>
    </g>
    <!-- мурал-радуга -->
    <rect x="446" y="92" width="88" height="134" rx="3" fill="#6E2639" stroke="#4A3A2A" stroke-width="3"/>
    <path d="M462 198 A34 34 0 0 1 530 198" fill="#E6B422" stroke="#4A3A2A" stroke-width="2.4"/>
    <path d="M470 198 A26 26 0 0 1 522 198" fill="#B8482A" stroke="#4A3A2A" stroke-width="2.2"/>
    <path d="M478 198 A18 18 0 0 1 514 198" fill="#F3D9CF" stroke="#4A3A2A" stroke-width="2"/>
    <path d="M486 198 A10 10 0 0 1 506 198" fill="#E6B422" stroke="#4A3A2A" stroke-width="1.8"/>
    <rect x="456" y="196" width="68" height="8" fill="#E6B422" stroke="#4A3A2A" stroke-width="2"/>
    <g fill="#BFE3E2" stroke="#3B332B" stroke-width="2.6">
      <rect x="560" y="92" width="22" height="18"/><rect x="596" y="92" width="22" height="18"/>
      <rect x="560" y="124" width="22" height="18"/><rect x="596" y="124" width="22" height="18"/>
      <rect x="560" y="156" width="22" height="18"/><rect x="596" y="156" width="22" height="18"/>
    </g>
  </g>

  <!-- деревья, дорога, машины -->
  <g>
    <path d="M0 280 L0 214 C10 194 20 190 30 198 L30 280Z" fill="#6E4A2E"/>
    <path d="M30 198 C62 164 106 170 122 198 C138 224 112 250 80 252 C46 254 20 232 30 198Z" fill="#5C7A4A"/>
    <path d="M44 202 C68 184 96 188 108 206 C120 224 102 240 82 242 C56 244 38 226 44 202Z" fill="#74925C"/>
    <path d="M600 280 L600 214 C610 194 620 190 630 198 L630 280Z" fill="#6E4A2E"/>
    <path d="M0 244 L640 232 L640 280 L0 280Z" fill="url(#road)"/>
    <path d="M0 244 L640 232" stroke="#8E7358" stroke-width="3"/>
    <path d="M20 280 L52 246 M108 280 L128 243 M196 280 L206 241 M284 280 L284 239 M372 280 L360 237 M460 280 L438 236 M548 280 L516 235 M624 280 L592 234" stroke="#B79B7C" stroke-width="2" opacity=".5"/>
    <!-- машины -->
    <g fill="#3A3028" opacity=".78">
      <path d="M84 250 C92 242 108 240 118 244 L126 250 L120 260 L88 260Z"/>
      <circle cx="94" cy="260" r="5" fill="#2B2420"/><circle cx="114" cy="260" r="5" fill="#2B2420"/>
      <path d="M526 246 C534 238 550 236 560 240 L568 246 L562 256 L530 256Z"/>
      <circle cx="536" cy="256" r="5" fill="#2B2420"/><circle cx="556" cy="256" r="5" fill="#2B2420"/>
    </g>
    <ellipse cx="104" cy="266" rx="38" ry="6" fill="#3B332B" opacity=".14" filter="url(#soft)"/>
    <ellipse cx="548" cy="262" rx="40" ry="6" fill="#3B332B" opacity=".14" filter="url(#soft)"/>
  </g>

  <!-- люди -->
  <g fill="#3A3028" opacity=".8">
    <circle cx="190" cy="238" r="4"/><path d="M185 244 C185 253 186 260 186 270 L192 270 C192 260 193 253 193 244 C190 241 188 241 185 244Z"/>
    <path d="M186 248 L179 258 L181 260 L187 252 M192 248 L199 258 L197 260 L191 252" fill="none" stroke="#3A3028" stroke-width="2.5"/>
    <circle cx="474" cy="236" r="4"/><path d="M469 242 C469 251 470 258 470 268 L476 268 C476 258 477 251 477 242 C474 239 472 239 469 242Z"/>
    <path d="M470 246 L463 256 L465 258 L471 250 M476 246 L483 256 L481 258 L475 250" fill="none" stroke="#3A3028" stroke-width="2.5"/>
  </g>
  <g fill="none" stroke="#3B332B" stroke-width="1.8" stroke-linecap="round" opacity=".55">
    <path d="M270 40 q4 -5 8 0 q4 -5 8 0"/>
    <path d="M436 34 q4 -5 8 0 q4 -5 8 0"/>
  </g>
  <rect width="640" height="280" filter="url(#grain)" opacity=".5" style="mix-blend-mode:multiply"/>
</svg>
