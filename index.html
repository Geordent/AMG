<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArtMap Georgia</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
  html, body { margin:0; height:100%; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#2a2622; }
  #map { position:absolute; inset:0; }
  /* Верхний overlay — нормальный flex-стек (без хардкод top:64/112) */
  #topui { position:absolute; left:0; right:0; top:calc(8px + env(safe-area-inset-top,0px)); z-index:6;
    display:flex; flex-direction:column; gap:6px; padding:0 8px; pointer-events:none; }
  #topui > #bar, #topui > #chips { pointer-events:auto; }
  #bar { display:flex; gap:6px; }
  #bar select, #bar button { font-size:14px; padding:9px 10px; border-radius:10px; border:1px solid #d8d1c6; background:#fff; color:#2a2622; }
  #bar button { margin-left:auto; background:#d9552b; border-color:#d9552b; color:#fff; font-weight:600; }
  #sheet { position:absolute; left:0; right:0; bottom:0; z-index:20; background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.2); padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)); max-height:75%; overflow-y:auto; }
  #sheet[hidden], #toast[hidden] { display:none; }
  #sheet h2 { margin:0 0 8px; font-size:18px; }
  .row { display:flex; align-items:center; gap:8px; font-size:14px; margin:6px 0 10px; }
  .pack { border:1px solid #e6e0d6; border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .pack b { font-size:15px; }
  .pack .st { font-size:13px; color:#7a7268; margin:2px 0 8px; }
  .bar { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:8px; }
  .bar i { display:block; height:100%; width:0; background:#d9552b; }
  .btns { display:flex; gap:8px; }
  .btn { flex:1; padding:10px; border-radius:10px; border:1px solid #d8d1c6; background:#fff; font-size:14px; }
  .btn.p { background:#d9552b; border-color:#d9552b; color:#fff; }
  .small { font-size:12px; color:#7a7268; margin:6px 0 10px; }
  #toast { position:absolute; left:12px; right:12px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:40; background:#2a2622; color:#fff; padding:10px 14px; border-radius:10px; font-size:13px; }
  .fatal { position:absolute; inset:0; z-index:60; background:#faf7f2; padding:24px; font-size:15px; }
  .amg-pop { font-size:13px; line-height:1.4; color:#2a2622; }
  .amg-pop .amg-title { font-weight:700; font-size:16px; margin:0 0 4px; padding-right:14px; }
  .amg-pop .amg-tags { display:flex; flex-wrap:wrap; gap:4px; margin:2px 0 6px; }
  .amg-tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#f2ede4; color:#5b5147; white-space:nowrap; }
  .amg-tag.cat { background:#fbe9e2; color:#b8431c; }
  .amg-tag.type { background:#eef0f4; color:#4a5568; }
  .amg-tag.st.st-active { background:#e3f0e4; color:#2f7d32; }
  .amg-tag.st.st-uncertain { background:#efefef; color:#7a7a7a; }
  .amg-tag.st.st-damaged { background:#fbeed2; color:#b06a00; }
  .amg-tag.st.st-replaced { background:#efe7f6; color:#6a45a3; }
  .amg-tag.st.st-removed { background:#f8e1e1; color:#b32626; }
  .amg-pop .amg-meta { color:#6b6258; font-size:12px; margin:1px 0; }
  .amg-pop .amg-addr { color:#3f382f; }
  .amg-pop .amg-desc { margin:4px 0; }
  .amg-pop .amg-src { font-size:11px; color:#7a7268; margin-top:3px; }
  .amg-pop .amg-src a { color:#a2543a; }
  .amg-pop .amg-src-text { color:#7a7268; }   /* generic source = plain provenance, не ссылка */
  .amg-detail .amg-actions { border-top:1px solid #eee; margin-top:12px; padding-top:10px; }   /* Навигация отделена от Источников */
  .amg-pop .amg-role { color:#a89f93; }
  .amg-src-all { margin-top:10px; border-top:1px solid #eee; padding-top:8px; }
  .amg-srcgrp { font-size:11px; color:#7a7268; margin:3px 0; line-height:1.4; }
  .amg-srcgrp-h { font-weight:600; color:#5b5147; }
  .amg-pop .amg-actions { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .amg-btn { flex:1 1 auto; text-align:center; font-size:12px; padding:8px 10px; border-radius:10px; border:1px solid #d8d1c6; background:#fff; color:#2a2622; text-decoration:none; white-space:nowrap; cursor:pointer; }
  .amg-btn.primary { background:#d9552b; border-color:#d9552b; color:#fff; font-weight:600; }
  .amg-btn.ghost { background:#fff; color:#a2543a; }
  .amg-pop .amg-art { border-top:1px solid #eee; padding-top:8px; margin-top:8px; }
  .amg-pop .amg-arts .amg-art:first-child { border-top:0; padding-top:0; margin-top:0; }
  .amg-pop .amg-art-title { font-weight:600; font-size:14px; }
  .amg-pop .amg-empty { color:#7a7268; font-size:12px; }
  .amg-media { margin:8px 0; }
  .amg-media-frame { position:relative; width:100%; aspect-ratio:4/3; max-height:220px; border-radius:10px; overflow:hidden; background:#f2ede4; display:flex; align-items:center; justify-content:center; }
  .amg-media-frame img { width:100%; height:100%; object-fit:cover; display:block; }
  .amg-media-fallback { display:none; font-size:12px; color:#a2543a; text-align:center; padding:12px; text-decoration:none; }
  .amg-media-error .amg-media-frame img { display:none; }
  .amg-media-error .amg-media-fallback { display:block; }
  .amg-attr { font-size:11px; color:#7a7268; margin-top:3px; line-height:1.35; }
  .amg-attr a { color:#a2543a; }
  @media (max-width:520px) { .amg-media-frame { max-height:200px; } }
  .maplibregl-popup { z-index:8; }
  .maplibregl-popup-content { border-radius:14px; padding:12px 14px; box-shadow:0 6px 24px rgba(0,0,0,.2); max-height:70vh; overflow-y:auto; }
  @media (max-width:520px) { .maplibregl-popup-content { max-width:92vw; } }
  #card { position:fixed; left:0; right:0; bottom:0; z-index:20; background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.25); padding:14px 14px 18px; max-height:72vh; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  #card::before { content:''; position:absolute; top:6px; left:50%; transform:translateX(-50%); width:40px; height:4px; border-radius:2px; background:#e3ddd3; }
  #card[hidden] { display:none; }
  #card .amg-head { margin-top:6px; }
  #card .amg-card-close { position:absolute; top:8px; right:10px; width:30px; height:30px; border:0; border-radius:50%; background:#f2ede4; color:#5b5147; font-size:18px; line-height:1; cursor:pointer; }
  @media (min-width:769px) { #card { display:none !important; } }
  #detail { position:fixed; inset:0; z-index:30; background:transparent; pointer-events:none; }
  #detail[hidden] { display:none; }
  #detail .amg-detail { position:absolute; top:0; right:0; height:100%; width:min(440px,92vw); background:#fff; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); box-shadow:-8px 0 30px rgba(0,0,0,.25); pointer-events:auto; }
  #detail .amg-detail-close { position:absolute; top:12px; right:12px; width:32px; height:32px; border:0; border-radius:50%; background:#f2ede4; color:#5b5147; font-size:18px; line-height:1; cursor:pointer; }
  #detail .amg-detail .amg-title { padding-right:38px; }
  #detail .amg-detail-gallery { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin:10px 0; }
  #detail .amg-detail-gallery .amg-media { margin:0; }
  #detail .amg-detail-gallery .amg-media-frame { aspect-ratio:1/1; max-height:none; }
  #detail .amg-detail-art { border-top:1px solid #eee; padding-top:10px; margin-top:10px; }
  #detail .amg-detail-art:first-child { border-top:0; padding-top:0; margin-top:0; }
  @media (max-width:600px) { #detail .amg-detail { left:0; right:0; width:auto; } }
  #brand { align-self:flex-start; pointer-events:none;
    background:rgba(255,255,255,.92); border:1px solid #e6e0d6; border-radius:12px; padding:6px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08); max-width:min(72vw,380px); }
  #brand .wm { font-size:16px; font-weight:700; color:#d9552b; line-height:1.1; letter-spacing:.2px; }
  #brand .tag { font-size:11px; color:#6b6258; line-height:1.15; margin-top:2px; }
  #chips { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px; }
  #chips::-webkit-scrollbar { display:none; }
  #chips .chip { flex:0 0 auto; font-size:13px; padding:7px 11px; border-radius:16px; border:1px solid #d8d1c6;
    background:#fff; color:#2a2622; white-space:nowrap; cursor:pointer; font-family:inherit; }
  #chips .chip.on { background:#d9552b; border-color:#d9552b; color:#fff; font-weight:600; }
  #chips .chip .cnt { opacity:.65; font-size:11px; margin-left:2px; }
  #chips .chip.on .cnt { opacity:.9; }
  #chips .chip-x { display:inline-block; margin-left:4px; font-weight:700; }
  /* Touch devices: увеличенные цели (desktop appearance не меняется) */
  @media (pointer: coarse) {
    #bar select, #bar button { min-height:44px; }
    #chips .chip { min-height:44px; padding:10px 14px; }
    .amg-btn { min-height:44px; padding:11px 12px; }
    #card .amg-card-close { width:44px; height:44px; font-size:22px; }
    #detail .amg-detail-close { width:44px; height:44px; font-size:22px; }
    .maplibregl-ctrl-group button { width:44px; height:44px; }
  }
  /* --- Step 2: shared scrim + mobile menu --- */
  #scrim { position:fixed; inset:0; z-index:18; background:rgba(20,20,20,.35); }
  #scrim[hidden] { display:none; }
  #menuBtn { position:absolute; top:0; right:8px; display:none; align-items:center; justify-content:center;
    width:44px; height:44px; border:1px solid #e0d8cc; border-radius:12px; background:rgba(255,255,255,.95);
    color:#2a2622; box-shadow:0 4px 12px rgba(43,38,34,.08); pointer-events:auto; cursor:pointer; }
  #menu { position:fixed; left:0; right:0; bottom:0; z-index:20; background:#fff; border-radius:16px 16px 0 0;
    box-shadow:0 -6px 24px rgba(0,0,0,.2); padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); max-height:80%; overflow-y:auto; }
  #menu[hidden] { display:none; }
  #menu::before { content:''; position:absolute; top:6px; left:50%; transform:translateX(-50%); width:40px; height:4px; border-radius:2px; background:#e3ddd3; }
  #menu #bar { flex-wrap:wrap; margin-top:6px; }
  /* Mobile shell: capability-based. pointer:coarse — сразу (без вспышки); html.is-mobile — фолбэк по ширине */
  @media (pointer: coarse) {
    #topui > #bar { display:none; }
    #menuBtn { display:flex; width:48px; height:48px; }
    #menu #bar select, #menu #bar button { min-height:44px; }
  }
  html.is-mobile #topui > #bar { display:none; }
  html.is-mobile #menuBtn { display:flex; }
  #rotateHint { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:15;
    display:flex; align-items:center; gap:10px; max-width:calc(100vw - 24px);
    background:rgba(42,38,34,.94); color:#fff; padding:10px 12px; border-radius:12px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  #rotateHint[hidden] { display:none; }
  #rotateHint button { border:0; background:transparent; color:#fff; font-size:18px; line-height:1; cursor:pointer; padding:4px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="topui">
  <div id="brand">
    <div class="wm">ArtMap Georgia</div>
    <div class="tag">Карта искусства и необычных городских объектов Грузии</div>
  </div>
  <button id="menuBtn" type="button" aria-label="Меню">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="#2a2622" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div id="bar">
    <select id="flavor"></select>
    <select id="lang">
      <option value="ru">Русский</option>
      <option value="ka">ქართული</option>
      <option value="en">English</option>
    </select>
    <button id="btnPacks">Офлайн</button>
  </div>
  <div id="chips"></div>
</div>
<div id="scrim" hidden></div>
<div id="sheet" hidden>
  <h2>Офлайн карта</h2>
  <label class="row"><input type="checkbox" id="offlineOnly"> Только скачанное (проверка без сети)</label>
  <div id="packs"></div>
  <div class="small" id="usage"></div>
  <div class="btns"><button class="btn" id="btnClose">Закрыть</button></div>
</div>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<div id="rotateHint" hidden><span class="rh-text"></span><button type="button" id="rhClose" aria-label="×">×</button></div>
<div id="card" hidden></div>
<div id="detail" hidden></div>

<script type="module">
let maplibregl, PMTiles, layers, namedFlavor;
try {
  ({ default: maplibregl } = await import('https://esm.sh/maplibre-gl@5'));
  ({ PMTiles } = await import('https://esm.sh/pmtiles@4'));
  ({ layers, namedFlavor } = await import('https://esm.sh/@protomaps/basemaps@5'));
} catch (e) {
  document.body.insertAdjacentHTML('beforeend',
    '<div class="fatal">Не удалось загрузить библиотеки карты. При первом запуске нужен интернет.<br><br>' + e + '</div>');
  throw e;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const GLYPHS = 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf';
const SPRITE = 'https://protomaps.github.io/basemaps-assets/sprites/v4/';
const FLAVORS = { light:'AMG', dark:'Тёмная', grayscale:'Серая', white:'Белая' };
// Файлы карты собирает GitHub Actions и кладёт рядом со страницей, поэтому CORS не мешает
const PACKS = [
  { id:'base',    title:'Вся Грузия, обзор', url:'tiles/georgia.pmtiles', minz:0,  maxz:9,  local:null },
  { id:'tbilisi', title:'Тбилиси, детально', url:'tiles/tbilisi.pmtiles', minz:10, maxz:15, local:null },
];
PACKS.forEach(p => p.remote = new PMTiles(p.url));
const state = { flavor:'light', lang:'ru', offlineOnly:false, lastError:'', categories:null };

// ---------- каталог (Stage 0 data) ----------
// SITE = физическое место (GeoJSON), ARTWORK связан с местом через site_id.
const catalog = {
  sites: [], siteById: new Map(), artworksBySite: new Map(),
  artists: new Map(), sources: new Map(), cities: new Map(),
};
let catalogError = null;

// Локализация: выбранный язык → en → ru → ka → первый непустой.
const LANG_ORDER = { ru:['ru','en','ka'], en:['en','ru','ka'], ka:['ka','en','ru'] };
function pick(loc) {
  if (!loc || typeof loc !== 'object') return '';
  for (const k of (LANG_ORDER[state.lang] || LANG_ORDER.ru)) {
    const v = loc[k]; if (typeof v === 'string' && v.trim()) return v.trim();
  }
  for (const k of Object.keys(loc)) { const v = loc[k]; if (typeof v === 'string' && v.trim()) return v.trim(); }
  return '';
}

const LB = {
  untitled:   { ru:'Без названия', en:'Untitled', ka:'უსათაურო' },
  artist:     { ru:'Художник', en:'Artist', ka:'მხატვარი' },
  access:     { ru:'Доступ', en:'Access', ka:'წვდომა' },
  visibleYes: { ru:'видно снаружи', en:'visible from outside', ka:'გარედან ჩანს' },
  visibleNo:  { ru:'не видно снаружи', en:'not visible from outside', ka:'გარედან არ ჩანს' },
  sources:    { ru:'Источники', en:'Sources', ka:'წყაროები' },
  route:      { ru:'Маршрут', en:'Route', ka:'მარშრუტი' },
  noArtworks: { ru:'Нет произведений', en:'No artworks', ka:'ნამუშევრები არ არის' },
  catalogFail:{ ru:'Каталог не загрузился: ', en:'Catalog failed to load: ', ka:'კატალოგი ვერ ჩაიტვირთა: ' },
  works:      { ru:'работ', en:'works', ka:'ნამუშევარი' },
  category:   { ru:'Категория', en:'Category', ka:'კატეგორია' },
  year:       { ru:'Год', en:'Year', ka:'წელი' },
  detail:     { ru:'Подробнее', en:'Details', ka:'დეტალურად' },
  detailHint: { ru:'Подробная карточка скоро', en:'Detail view coming soon', ka:'დეტალური ხედი მალე' },
  photo:      { ru:'Фото', en:'Photo', ka:'ფოტო' },
  photoAlt:   { ru:'Фото объекта', en:'Photo of the object', ka:'ობიექტის ფოტო' },
  photoFail:  { ru:'Фото недоступно', en:'Photo unavailable', ka:'ფოტო მიუწვდომელია' },
  credit:     { ru:'Credit', en:'Credit', ka:'Credit' },
  source:     { ru:'Источник', en:'Source', ka:'წყარო' },
  srcObject:  { ru:'Объект', en:'Object', ka:'ობიექტი' },
  srcPhoto:   { ru:'Фото', en:'Photos', ka:'ფოტოები' },
  srcCatalog: { ru:'Каталог / проект', en:'Catalog / project', ka:'კატალოგი / პროექტი' },
  srcProv:    { ru:'Провенанс', en:'Provenance', ka:'წარმომავლობა' },
};
const TYPE_LABELS = {
  mural:{ru:'Мурал',en:'Mural',ka:'მურალი'}, street_art:{ru:'Стрит-арт',en:'Street art',ka:'სტრიტ-არტი'},
  mosaic:{ru:'Мозаика',en:'Mosaic',ka:'მოზაიკა'}, monument:{ru:'Монумент',en:'Monument',ka:'მონუმენტი'},
  sculpture:{ru:'Скульптура',en:'Sculpture',ka:'სკულპტურა'}, installation:{ru:'Инсталляция',en:'Installation',ka:'ინსტალაცია'},
  architectural_art:{ru:'Архитектурное искусство',en:'Architectural art',ka:'არქიტექტურული ხელოვნება'},
  monumental_art:{ru:'Монументальное искусство',en:'Monumental art',ka:'მონუმენტური ხელოვნება'}, other:{ru:'Другое',en:'Other',ka:'სხვა'},
};
const STATUS_LABELS = {
  active:{ru:'Активно',en:'Active',ka:'აქტიური'}, removed:{ru:'Утрачено',en:'Removed',ka:'მოხსნილი'},
  damaged:{ru:'Повреждено',en:'Damaged',ka:'დაზიანებული'}, replaced:{ru:'Заменено',en:'Replaced',ka:'შეცვლილი'},
  uncertain:{ru:'Не подтверждено',en:'Uncertain',ka:'გაურკვეველი'},
};
const ACCESS_LABELS = {
  public:{ru:'Свободный',en:'Public',ka:'საჯარო'}, courtyard:{ru:'Двор',en:'Courtyard',ka:'ეზო'},
  restricted:{ru:'Ограниченный',en:'Restricted',ka:'შეზღუდული'}, private:{ru:'Частная территория',en:'Private',ka:'კერძო'},
  ticket_required:{ru:'По билету',en:'Ticket required',ka:'ბილეთით'}, permission_required:{ru:'По разрешению',en:'Permission required',ka:'ნებართვით'},
};
const ROLE_LABELS = {
  identity:{ru:'идентификация',en:'identity',ka:'იდენტიფიკაცია'}, location:{ru:'место',en:'location',ka:'ლოკაცია'},
  artist:{ru:'художник',en:'artist',ka:'მხატვარი'}, year:{ru:'год',en:'year',ka:'წელი'},
  photo:{ru:'фото',en:'photo',ka:'ფოტო'}, description:{ru:'описание',en:'description',ka:'აღწერა'},
};
const labelOf = (dict, key) => (dict[key] ? pick(dict[key]) : key);
function categoryLabel(key) { const c = CATEGORIES.find(x => x.key === key); return c ? pick(c.label) : ''; }
function worksLabel(n) {
  const l = state.lang;
  if (l === 'en') return `${n} ${n === 1 ? 'work' : 'works'}`;
  if (l === 'ka') return `${n} ნამუშევარი`;
  const m10 = n % 10, m100 = n % 100;
  const word = (m10 === 1 && m100 !== 11) ? 'работа' : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? 'работы' : 'работ';
  return `${n} ${word}`;
}

// Внешний маршрут: без собственного routing. Основной провайдер первый, остальные — альтернативы.
const ROUTE_PROVIDERS = [

async function loadCatalog() {
  const get = p => fetch(p).then(r => { if (!r.ok) throw new Error(p + ' → HTTP ' + r.status); return r.json(); });
  const [sites, artworks, artists, sources, cities] = await Promise.all([
    get('data/sites.geojson'), get('data/artworks.json'), get('data/artists.json'),
    get('data/sources.json'), get('data/cities.json'),
  ]);
  catalog.sites = sites.features || [];
  catalog.siteById = new Map(catalog.sites.map(f => [f.properties.id, f]));
  catalog.artists = new Map(artists.map(a => [a.id, a]));
  catalog.sources = new Map(sources.map(s => [s.id, s]));
  catalog.cities = new Map(Object.entries(cities));
  for (const a of artworks) {
    if (!catalog.artworksBySite.has(a.site_id)) catalog.artworksBySite.set(a.site_id, []);
    catalog.artworksBySite.get(a.site_id).push(a);
  }
  for (const arr of catalog.artworksBySite.values()) {
    arr.sort((a, b) => (STATUS_RANK[a.status] - STATUS_RANK[b.status]) || ((b.year || 0) - (a.year || 0)));
  }
}

  const t = db.transaction('files', mode); const q = fn(t.objectStore('files'));
  t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
}));
const idbGet = k => tx('readonly', s => s.get(k));

class BlobSource {
  constructor(blob, key) { this.blob = blob; this.key = key; }

}

// Два независимых tile-источника: базовая Грузия (z0–9, выше — overzoom) и детальный
// Тбилиси (z10–15, только в своём bbox). Протоколы НЕ переключаются по зуму глобально,
// поэтому вне bbox Тбилиси базовый слой продолжает показываться (раньше исчезал).
const tileProtocol = pack => async (params, abort) => {
  const m = /(\d+)\/(\d+)\/(\d+)/.exec(params.url);
  const z = +m[1], x = +m[2], y = +m[3];
  const inst = pack.local || (state.offlineOnly ? null : pack.remote);
  if (!inst) return { data: new Uint8Array() };
  try {
    const r = await inst.getZxy(z, x, y, abort && abort.signal);
    return { data: r ? new Uint8Array(r.data) : new Uint8Array() };
  } catch (e) {
    // Отменённый запрос НЕ должен кэшироваться как пустой тайл — иначе при возврате
    // на этот зум остаётся «дырка». Пробрасываем ошибку, MapLibre перезапросит позже.
    if (abort && abort.signal && abort.signal.aborted) throw e;
    state.lastError = String(e && e.message || e);
    return { data: new Uint8Array() };
  }
};
maplibregl.addProtocol('amgbase', tileProtocol(PACKS[0]));

function amgTheme(ls) {
  const P = AMG_PAL;
  const themed = ls.map(l => {
    const id = String(l.id || '').toLowerCase();
    const sl = String(l['source-layer'] || '').toLowerCase();
    const key = id + ' ' + sl;
    const paint = { ...(l.paint || {}) };
    if (l.type === 'background') { paint['background-color'] = P.land; return { ...l, paint }; }
    if (l.type === 'fill') {
      if (/building/.test(key)) { paint['fill-color'] = P.building; paint['fill-outline-color'] = P.buildingEdge; paint['fill-opacity'] = 0.96; return { ...l, paint }; }
      if (/water|ocean|sea|lake|bay/.test(key)) { paint['fill-color'] = P.water; return { ...l, paint }; }
      if (/glacier|ice|snow/.test(key)) { paint['fill-color'] = P.snow; return { ...l, paint }; }
      if (/forest|wood|tree/.test(key)) { paint['fill-color'] = P.forest; return { ...l, paint }; }
      if (/grass|meadow|park|garden|golf|pitch/.test(key)) { paint['fill-color'] = P.grass; return { ...l, paint }; }
      if (/sand|beach|desert/.test(key)) { paint['fill-color'] = P.sand; return { ...l, paint }; }
      if (/residential|urban|commercial|industrial|suburb|neighbourhood/.test(key)) { paint['fill-color'] = P.urban; return { ...l, paint }; }
      if (/landcover|landuse|earth|natural|terrain/.test(key)) { paint['fill-color'] = P.land2; return { ...l, paint }; }
      return l;
    }
    if (l.type === 'line') {
      if (/casing/.test(key)) {
        const c = /highway|motorway|trunk/.test(key) ? P.roadMajorEdge
                : /major|primary/.test(key) ? P.roadPrimaryEdge
                : /secondary|tertiary/.test(key) ? P.roadMidEdge
                : P.roadMinorEdge;
        paint['line-color'] = c; return { ...l, paint };
      }
      if (/boundary|admin/.test(key)) { paint['line-color'] = P.boundary; if (paint['line-dasharray'] == null) paint['line-dasharray'] = [2, 2]; return { ...l, paint }; }
      if (/rail/.test(key)) { paint['line-color'] = P.rail; return { ...l, paint }; }
      if (/highway|motorway|trunk/.test(key)) { paint['line-color'] = P.roadMajor; return { ...l, paint }; }
      if (/major|primary/.test(key)) { paint['line-color'] = P.roadPrimary; return { ...l, paint }; }
      if (/secondary|tertiary/.test(key)) { paint['line-color'] = P.roadMid; return { ...l, paint }; }
      if (/minor|service|residential|path|track|street|road|link|other|taxiway|runway|pier/.test(key)) { paint['line-color'] = P.roadMinor; return { ...l, paint }; }
      if (/water|river|canal|stream|waterway/.test(key)) { paint['line-color'] = P.river; return { ...l, paint }; }
      return l;
    }

      // Номера домов: включаем начиная с z15 (в тайлах адреса есть уже на z15), иначе слой скрыт до z18.

  if (!state.offlineOnly) {
    sources.openmaptiles = { type:'vector', url:'https://tiles.openfreemap.org/planet' };
    online = onlineDetailLayers();
  }
  return {
    version: 8,
    glyphs: GLYPHS,
    sprite: SPRITE + state.flavor,
    sources,
    // «Светлая» = фирменная AMG-тема; остальные flavor остаются стандартными Protomaps.
    layers: [...base, ...online, ...detail],
  };
}
// Online detail-слои в схеме OpenMapTiles (OpenFreeMap), стилизованы под AMG_PAL.
// source-layer/field имена сверены с TileJSON https://tiles.openfreemap.org/planet:
// transportation{class,brunnel,ramp}, transportation_name{class,name,name:*,ref},
// building{}, place{class,name,name:*} (0–14), housenumber{housenumber} (14).
function onlineDetailLayers() {
  const P = AMG_PAL;
  const roadName  = ['coalesce', ['get', 'name:' + state.lang], ['get', 'name_en'], ['get', 'name']];
  const placeName = ['coalesce', ['get', 'name:' + state.lang], ['get', 'name_en'], ['get', 'name']];
  const lineGeom  = ['match', ['geometry-type'], ['LineString', 'MultiLineString'], true, false];
  return [
    { id:'ofm-road-casing-major', type:'line', source:'openmaptiles', 'source-layer':'transportation', minzoom:10,
      filter:['all', lineGeom, ['match', ['get','class'], ['motorway','trunk','primary','secondary','tertiary'], true, false]],
      layout:{ 'line-cap':'round', 'line-join':'round' },
      paint:{ 'line-color':P.roadMajorEdge, 'line-width':['interpolate', ['linear'], ['zoom'], 10, 2.6, 14, 10] } },
    { id:'ofm-road-major', type:'line', source:'openmaptiles', 'source-layer':'transportation', minzoom:10,
      filter:['all', lineGeom, ['match', ['get','class'], ['motorway','trunk','primary','secondary','tertiary'], true, false]],
      layout:{ 'line-cap':'round', 'line-join':'round' },
      paint:{ 'line-color':P.roadMajor, 'line-width':['interpolate', ['linear'], ['zoom'], 10, 1.4, 14, 6.5] } },
    { id:'ofm-road-minor', type:'line', source:'openmaptiles', 'source-layer':'transportation', minzoom:12,
      filter:['all', lineGeom, ['match', ['get','class'], ['minor','service','track','path','pedestrian'], true, false]],
      layout:{ 'line-cap':'round', 'line-join':'round' },
      paint:{ 'line-color':P.roadMinor, 'line-width':['interpolate', ['linear'], ['zoom'], 12, 0.6, 14, 2.6] } },
    { id:'ofm-building', type:'fill', source:'openmaptiles', 'source-layer':'building', minzoom:13,
      paint:{ 'fill-color':P.building, 'fill-outline-color':P.buildingEdge, 'fill-opacity':0.9 } },
    // Порядок symbol-слоёв = приоритет размещения (позже = выше): дорожные и place-подписи
    // идут ПОСЛЕ номеров домов, иначе housenumber вытесняет названия улиц (collision).
    { id:'ofm-housenumber', type:'symbol', source:'openmaptiles', 'source-layer':'housenumber', minzoom:14,
      layout:{ 'text-field':['coalesce', ['get','housenumber'], ''], 'text-font':['Noto Sans Regular'], 'text-size':10, 'text-optional':true },
      paint:{ 'text-color':'#7a6a56', 'text-halo-color':'#ffffff', 'text-halo-width':1.3 } },
    { id:'ofm-road-name', type:'symbol', source:'openmaptiles', 'source-layer':'transportation_name', minzoom:11,
      filter:lineGeom,
      layout:{ 'text-field':roadName, 'text-font':['Noto Sans Regular'],
        'text-size':['interpolate', ['linear'], ['zoom'], 11, 10, 14, 12],
        'symbol-placement':'line', 'text-rotation-alignment':'map', 'text-pitch-alignment':'map', 'text-optional':true },
      paint:{ 'text-color':P.label, 'text-halo-color':P.labelHalo, 'text-halo-width':1.3 } },
    { id:'ofm-place', type:'symbol', source:'openmaptiles', 'source-layer':'place', minzoom:10,
      filter:['match', ['get','class'], ['city','town','village'], true, false],
      layout:{ 'text-field':placeName, 'text-font':['Noto Sans Medium'],
        'text-size':['interpolate', ['linear'], ['zoom'], 10, 11, 14, 15],
        'text-allow-overlap':false, 'text-optional':true },
      paint:{ 'text-color':P.label, 'text-halo-color':P.labelHalo, 'text-halo-width':1.6 } },
  ];
}

  dragRotate:false, touchPitch:false, attributionControl:{ compact:true } });
map.touchZoomRotate.disableRotation();  // pinch-zoom остаётся, two-finger rotate — нет
map.addControl(new maplibregl.NavigationControl({ showCompass:false }), 'bottom-right');
map.addControl(new maplibregl.GeolocateControl({ positionOptions:{ enableHighAccuracy:true }, trackUserLocation:true }), 'bottom-right');
map.addControl(new maplibregl.ScaleControl({ unit:'metric' }), 'bottom-left');
window.amgMap = map; // read-only test/debug hook (no behavior change)

  const src = srcList.length ? `<div class="amg-src">${esc(pick(LB.sources))}: ${sourceLinks(srcList)}</div>` : '';
  return `<div class="amg-pop amg-preview">
    <div class="amg-title">${esc(title)}</div>
    ${tags ? `<div class="amg-tags">${tags}</div>` : ''}
    ${artists ? `<div class="amg-meta">${esc(pick(LB.artist))}: ${esc(artists)}</div>` : ''}
    ${desc ? `<div class="amg-desc">${esc(desc)}</div>` : ''}
    ${landmark ? `<div class="amg-meta amg-addr">${esc(landmark)}</div>` : ''}
    <div class="amg-meta">${esc(pick(LB.access))}: ${esc(labelOf(ACCESS_LABELS, p.access))} · ${esc(vis)}</div>
    ${media}
    ${src}
    <div class="amg-actions">${routeButtons(lat, lng)}<button type="button" class="amg-btn ghost" data-detail="${esc(siteId)}">${esc(pick(LB.detail))}</button></div>
  </div>`;
}
// Full detail panel content: all media (deduped) + full SITE + all artworks.
function detailHtml(siteId) {
  const f = catalog.siteById.get(siteId);
  if (!f) return '<b>—</b>';
  const p = f.properties;
  const [lng, lat] = f.geometry.coordinates;
  const city = pick(catalog.cities.get(p.city) || {}) || p.city || '';
  const arts = catalog.artworksBySite.get(siteId) || [];
  const vis = p.visible_from_outside ? pick(LB.visibleYes) : pick(LB.visibleNo);
  const name = pick(p.name);
  const first = arts[0] || null;
  const catKey = first ? (CATEGORY_OF_TYPE[first.type] || '') : '';
  const tags = [
    catKey ? `<span class="amg-tag cat">${esc(categoryLabel(catKey))}</span>` : '',
    arts.length ? `<span class="amg-tag st st-${esc(siteStatus(arts))}">${esc(labelOf(STATUS_LABELS, siteStatus(arts)))}</span>` : '',
    `<span class="amg-tag cnt">${esc(worksLabel(arts.length))}</span>`,
  ].filter(Boolean).join('');
  const addr = pick(p.address);
  const landmark = [addr, city].filter(Boolean).join(', ');
  const siteDesc = pick(p.description);
  const shown = new Set();
  const gallery = [];
  const allMedia = [...(p.media || []), ...arts.flatMap(a => a.media || [])];
  for (let i = 0; i < allMedia.length; i++) { const one = mediaHtml(allMedia, shown); if (!one) break; gallery.push(one); }
  const artsHtml = arts.length ? arts.map(a => {
    const t = pick(a.title) || pick(LB.untitled);
    const an = (a.artist_ids || []).map(id => catalog.artists.get(id)?.name).filter(Boolean).join(', ');
    const d = pick(a.description);
    const tg = [
      a.type ? `<span class="amg-tag type">${esc(labelOf(TYPE_LABELS, a.type))}</span>` : '',
      a.status ? `<span class="amg-tag st st-${esc(a.status)}">${esc(labelOf(STATUS_LABELS, a.status))}</span>` : '',
      a.year != null ? `<span class="amg-tag year">${esc(a.year)}</span>` : '',
    ].filter(Boolean).join('');
    return `<div class="amg-detail-art">
      <div class="amg-art-title">${esc(t)}</div>
      ${tg ? `<div class="amg-tags">${tg}</div>` : ''}
      ${an ? `<div class="amg-meta">${esc(pick(LB.artist))}: ${esc(an)}</div>` : ''}
      ${d ? `<div class="amg-desc">${esc(d)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="amg-empty">${esc(pick(LB.noArtworks))}</div>`;
  return `<div class="amg-detail">
    <button type="button" class="amg-detail-close" data-detail-close aria-label="×">×</button>
    <div class="amg-title">${esc(name || (first && pick(first.title)) || pick(LB.untitled))}</div>
    <div class="amg-tags">${tags}</div>
    ${landmark ? `<div class="amg-meta amg-addr">${esc(landmark)}</div>` : ''}
    <div class="amg-meta">${esc(pick(LB.access))}: ${esc(labelOf(ACCESS_LABELS, p.access))} · ${esc(vis)}</div>
    ${siteDesc ? `<div class="amg-desc">${esc(siteDesc)}</div>` : ''}
    ${gallery.length ? `<div class="amg-detail-gallery">${gallery.join('')}</div>` : ''}
    <div class="amg-detail-arts">${artsHtml}</div>
    ${detailSourcesHtml(p, arts)}
  </div>`;
}
// ---------- Step 2: unified overlay manager (scrim + stack + map lock) ----------
const Overlays = {
  stack: [], els: {}, closer: {}, locked: false, prev: null,
  register(id, el) { this.els[id] = el; },
  setCloser(id, fn) { this.closer[id] = fn; },
  isOpen(id) { return this.stack.indexOf(id) >= 0; },
  show(id) { if (!this.els[id]) return; if (!this.isOpen(id)) this.stack.push(id); this.els[id].hidden = false; this.update(); },
  hide(id) { this.stack = this.stack.filter(x => x !== id); if (this.els[id]) this.els[id].hidden = true; this.update(); },
  closeTop() { const id = this.stack[this.stack.length - 1]; if (!id) return; (this.closer[id] || (() => this.hide(id)))(); },
  closeAll() { while (this.stack.length) this.closeTop(); },
  update() {
    const on = this.stack.length > 0;
    if (this.els.scrim) this.els.scrim.hidden = !on;
    if (on) this.lock(); else this.unlock();
  },
  lock() {
    if (this.locked) return;
    const m = map, on = h => !!(h && h.isEnabled && h.isEnabled());
    this.prev = { dragPan:on(m.dragPan), touchZoomRotate:on(m.touchZoomRotate), touchPitch:on(m.touchPitch),
      doubleClickZoom:on(m.doubleClickZoom), scrollZoom:on(m.scrollZoom), boxZoom:on(m.boxZoom) };
    for (const h of [m.dragPan, m.touchZoomRotate, m.touchPitch, m.doubleClickZoom, m.scrollZoom, m.boxZoom]) if (h && h.disable) h.disable();
    this.locked = true;
  },
  unlock() {
    if (!this.locked) return;
    const m = map, p = this.prev || {};
    const set = (h, v) => { if (h) (v ? h.enable() : h.disable()); };
    set(m.dragPan, p.dragPan); set(m.touchZoomRotate, p.touchZoomRotate); set(m.touchPitch, p.touchPitch);
    set(m.doubleClickZoom, p.doubleClickZoom); set(m.scrollZoom, p.scrollZoom); set(m.boxZoom, p.boxZoom);
    this.locked = false;
  },
};
Overlays.register('scrim', document.getElementById('scrim'));
Overlays.register('menu', document.getElementById('menu'));
Overlays.register('sheet', document.getElementById('sheet'));
Overlays.register('card', document.getElementById('card'));
Overlays.register('detail', document.getElementById('detail'));
// scrim закрывает только по «тапу» (не по drag/свайпу, чтобы обычный жест не закрывал card)
(function scrimTap() {
  const s = document.getElementById('scrim');
  if (!s) return;
  let sx = 0, sy = 0, moved = false;
  s.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; moved = false; });
  s.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) moved = true; });
  s.addEventListener('click', () => { if (!moved) Overlays.closeTop(); });
})();

// Mobile detection: capability (pointer:coarse) + width<=768 фолбэк (узкие десктоп-окна).
// Так landscape-телефоны (ширина>768) остаются в mobile-шелле, desktop с мышью — в wide.
const mqCoarse = window.matchMedia('(pointer: coarse)');
const mqNarrow = window.matchMedia('(max-width: 768px)');
const mqLand   = window.matchMedia('(orientation: landscape)');
const mqShort  = window.matchMedia('(max-height: 500px)');
const isMobileUI = () => mqCoarse.matches || mqNarrow.matches;
function applyMobileClass() { document.documentElement.classList.toggle('is-mobile', isMobileUI()); }

// Mobile menu: existing #bar перемещается в #menu (без дублей/новых id), обратно при wide.
function relocateBar() {
  const bar = document.getElementById('bar'), topui = document.getElementById('topui'), menu = document.getElementById('menu'), chips = document.getElementById('chips');
  if (!bar || !topui || !menu) return;
  if (isMobileUI()) { if (bar.parentElement !== menu) menu.appendChild(bar); }
  else {
    if (bar.parentElement !== topui) topui.insertBefore(bar, chips);
    if (Overlays.isOpen('menu')) Overlays.hide('menu');
  }
}
// Rotate hint: touch + landscape + малая высота → советуем портрет (неблокирующий, dismissible).
function rotateDismissed() { try { return localStorage.getItem('amg-rotate-dismiss') === '1'; } catch (_) { return false; } }
function updateRotateHint() {
  const el = document.getElementById('rotateHint'); if (!el) return;
  const show = mqCoarse.matches && mqLand.matches && mqShort.matches && !rotateDismissed();
  if (show) { const t = el.querySelector('.rh-text'); if (t) t.textContent = pick({ ru:'Поверните телефон вертикально', en:'Rotate to portrait', ka:'დააბრუნეთ ვერტიკალურად' }); }
  el.hidden = !show;
}
const menuBtn = document.getElementById('menuBtn');
if (menuBtn) menuBtn.onclick = () => Overlays.show('menu');
const rhClose = document.getElementById('rhClose');
if (rhClose) rhClose.onclick = () => { try { localStorage.setItem('amg-rotate-dismiss', '1'); } catch (_) {} updateRotateHint(); };

function applyLayoutMode() {
  applyMobileClass(); relocateBar(); updateRotateHint();
  if (!isMobileUI() && Overlays.isOpen('menu')) Overlays.hide('menu');
}
applyLayoutMode();
for (const mq of [mqCoarse, mqNarrow, mqLand, mqShort]) {
  if (mq.addEventListener) mq.addEventListener('change', applyLayoutMode);
  else if (mq.addListener) mq.addListener(applyLayoutMode);
}

const isNarrow = () => isMobileUI();   // mobile → bottom-sheet card; wide/desktop → popup
let cardSiteId = null;
function renderCard(siteId) {
  const c = document.getElementById('card');
  c.innerHTML = `<button type="button" class="amg-card-close" data-card-close aria-label="×">×</button>${sitePopupHtml(siteId)}`;
  c.hidden = false; cardSiteId = siteId;
  c.scrollTop = 0;
  wireMedia(c);
  Overlays.show('card');
}
function closeCard() { const c = document.getElementById('card'); if (c) { c.hidden = true; c.innerHTML = ''; c.style.transform = ''; } cardSiteId = null; Overlays.hide('card'); }
let detailSiteId = null;
function renderDetail(siteId) {
  const d = document.getElementById('detail');
  if (!d) return;
  d.innerHTML = detailHtml(siteId);
  d.hidden = false;
  detailSiteId = siteId;
  d.querySelector('.amg-detail')?.scrollTo?.(0, 0);
  wireMedia(d);
  Overlays.show('detail');
}
function closeDetail() { const d = document.getElementById('detail'); if (d) { d.hidden = true; d.innerHTML = ''; } detailSiteId = null; Overlays.hide('detail'); }
function openDetail(siteId) {
  if (typeof window.amgOpenDetail === 'function') return window.amgOpenDetail(siteId);
  renderDetail(siteId); // Popup/Card остаются под Detail (z-index) и снова доступны после Close
}
function clampPopup(popup) {
  const el = popup.getElement();
  if (!el) return;
  const pad = 8, r = el.getBoundingClientRect();
  let dx = 0, dy = 0;
  if (r.left < pad) dx = pad - r.left;
  if (r.top < pad) dy = pad - r.top;
  if (r.right > innerWidth - pad) dx = (innerWidth - pad) - r.right;
  if (r.bottom > innerHeight - pad) dy = (innerHeight - pad) - r.bottom;
  if (dx || dy) el.style.transform = `${el.style.transform} translate(${Math.round(dx)}px, ${Math.round(dy)}px)`;
}
document.getElementById('card').addEventListener('click', ev => {
  if (ev.target.closest('[data-card-close]')) return closeCard();
  const b = ev.target.closest('[data-detail]');
  if (b) openDetail(b.dataset.detail);
});
// Простой swipe-down dismiss для #card (без gesture library): только когда scrollTop===0 и движение вниз.
(function cardSwipe() {
  const c = document.getElementById('card');
  if (!c || !('ontouchstart' in window)) return;
  let startY = 0, tracking = false;
  c.addEventListener('touchstart', e => {
    if (c.scrollTop > 0 || e.touches.length !== 1) { tracking = false; return; }
    startY = e.touches[0].clientY; tracking = true; c.style.transition = 'none';
  }, { passive: true });
  c.addEventListener('touchmove', e => {
    if (!tracking) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) c.style.transform = 'translateY(' + dy + 'px)';
  }, { passive: true });
  c.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false; c.style.transition = '';
    const endY = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : startY;
    c.style.transform = '';
    if (endY - startY > 60) closeCard();
  }, { passive: true });
})();
document.getElementById('detail').addEventListener('click', ev => {
  if (ev.target.id === 'detail') return closeDetail(); // backdrop
  if (ev.target.closest('[data-detail-close]')) return closeDetail();
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (Overlays.stack.length) Overlays.closeTop();   // detail (верх) → card/menu/sheet
});
// closers: закрывать через существующие функции (сброс состояния), не только hidden
Overlays.setCloser('card', closeCard);
Overlays.setCloser('detail', closeDetail);
Overlays.setCloser('sheet', () => Overlays.hide('sheet'));
Overlays.setCloser('menu', () => Overlays.hide('menu'));
map.on('click', 'sites', e => {
  const id = e.features[0].properties.id;
  if (isNarrow()) return renderCard(id);
  const pop = new maplibregl.Popup({ offset:14, maxWidth:'min(360px, calc(100vw - 24px))' })
    .setLngLat(e.features[0].geometry.coordinates)
    .setHTML(sitePopupHtml(id));
  pop.on('open', () => requestAnimationFrame(() => clampPopup(pop)));
  pop.addTo(map);
  wireMedia(pop.getElement());
  pop.getElement().addEventListener('click', ev => {
    const b = ev.target.closest('[data-detail]');
    if (b) openDetail(b.dataset.detail);
  });
});
map.on('click', e => {
  if (!isNarrow() || !cardSiteId || !map.getLayer('sites')) return;
  if (!map.queryRenderedFeatures(e.point, { layers: ['sites'] }).length) closeCard();
});
map.on('mouseenter', 'sites', () => map.getCanvas().style.cursor = 'pointer');
map.on('mouseleave', 'sites', () => map.getCanvas().style.cursor = '');
// Cluster click → expand (getClusterExpansionZoom). Если зум не меняется — корректный no-op.
map.on('click', 'sites-clusters', e => {
  const f = e.features[0];
  const src = map.getSource('sites');
  if (!src) return;
  const finish = z => {
    const target = Math.min(z, map.getMaxZoom());
    if (Math.abs(target - map.getZoom()) < 0.01) return;   // expansion не меняет зум → ничего
    map.easeTo({ center: f.geometry.coordinates, zoom: target });
  };
  const r = src.getClusterExpansionZoom(f.properties.cluster_id);
  if (r && typeof r.then === 'function') r.then(finish).catch(() => {});
  else if (typeof r === 'function') r((err, z) => { if (!err) finish(z); });
});
map.on('mouseenter', 'sites-clusters', () => map.getCanvas().style.cursor = 'pointer');
map.on('mouseleave', 'sites-clusters', () => map.getCanvas().style.cursor = '');

// ---------- управление ----------
const $ = id => document.getElementById(id);
const toast = (t, ms = 5000) => { $('toast').textContent = t; $('toast').hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').hidden = true, ms); };
if (catalogError) toast(pick(LB.catalogFail) + catalogError, 9000);
for (const [k, v] of Object.entries(FLAVORS)) $('flavor').insertAdjacentHTML('beforeend', `<option value="${k}">${v}</option>`);
$('flavor').onchange = e => { state.flavor = e.target.value; map.setStyle(buildStyle()); };
$('lang').onchange = e => { state.lang = e.target.value; map.setStyle(buildStyle()); renderChips(); updateRotateHint(); if (cardSiteId) renderCard(cardSiteId); if (detailSiteId) renderDetail(detailSiteId); };
$('offlineOnly').onchange = e => { state.offlineOnly = e.target.checked; map.setStyle(buildStyle()); toast(state.offlineOnly ? 'Показываю только скачанное' : 'Снова можно читать карту из сети'); };
$('btnPacks').onclick = () => { Overlays.hide('menu'); Overlays.show('sheet'); renderPacks(); };
$('btnClose').onclick = () => Overlays.hide('sheet');

// ---------- категории (чипы) ----------
function categoryCounts() {
  const counts = Object.fromEntries(CATEGORIES.map(c => [c.key, 0]));
  for (const f of catalog.sites) {
    const arts = catalog.artworksBySite.get(f.properties.id) || [];
    const k = arts[0] && CATEGORY_OF_TYPE[arts[0].type];
    if (k) counts[k]++;
  }
  counts._all = catalog.sites.length;
  return counts;
}
function renderChips() {
  const counts = categoryCounts();
  const allOn = state.categories === null;
  const active = state.categories || new Set();
  let html = `<button class="chip${allOn ? ' on' : ''}" data-all>${esc(pick(ALL_LABEL))} <span class="cnt">${counts._all}</span>`;
  if (!allOn) html += ` <span class="chip-x" data-reset title="${esc(pick(RESET_LABEL))}">×</span>`;
  html += `</button>`;
  for (const c of CATEGORIES) {
    html += `<button class="chip${active.has(c.key) ? ' on' : ''}" data-cat="${c.key}">${esc(pick(c.label))} <span class="cnt">${counts[c.key] || 0}</span></button>`;
  }
  $('chips').innerHTML = html;
}
$('chips').onclick = e => {
  if (e.target.closest('[data-reset]')) state.categories = null;                          // сброс → All
  else if (e.target.closest('[data-all]')) state.categories = (state.categories === null) ? new Set() : null; // All ⇄ ничего
  else {
    const cat = e.target.closest('[data-cat]');
    if (!cat) return;
    const k = cat.dataset.cat;
    if (state.categories === null) state.categories = new Set([k]);                        // выбор из All → только эта
    else if (state.categories.has(k)) state.categories.delete(k);
    else state.categories.add(k);
  }
  applyCategoryFilter();
  renderChips();
};
renderChips();

map.on('idle', () => { if (state.lastError) { toast('Ошибка карты, ' + state.lastError, 8000); state.lastError = ''; } });

const mb = b => (b / 1048576).toFixed(1) + ' МБ';
let busy = null;

async function probe(p) {
  try {
    const r = await fetch(p.url, { headers: { Range: 'bytes=0-15' }, cache: 'no-store' });
    return r.ok ? 'доступен на сервере' : 'на сервере не найден, код ' + r.status;
  } catch (e) { return 'нет связи с сервером'; }
}

async function renderPacks() {
  const box = $('packs'); box.innerHTML = '';
  for (const p of PACKS) {
    const el = document.createElement('div'); el.className = 'pack';
    const st = p.local ? 'Скачано, ' + mb(p.size) : 'Не скачано. Файл ' + (await probe(p));
    el.innerHTML = `<b>${p.title}</b><div class="st" id="st-${p.id}">${st}</div><div class="bar"><i id="pb-${p.id}"></i></div>
      <div class="btns"><button class="btn p" id="dl-${p.id}">${p.local ? 'Обновить' : 'Скачать'}</button>
      <button class="btn" id="rm-${p.id}">Удалить</button></div>`;
    box.appendChild(el);
    $('dl-' + p.id).onclick = () => download(p);
    $('rm-' + p.id).onclick = () => remove(p);
  }
  if (navigator.storage && navigator.storage.estimate) {
    const e = await navigator.storage.estimate();
    $('usage').textContent = 'Занято в браузере ' + mb(e.usage || 0) + ' из ' + mb(e.quota || 0) + ' (оценка браузера).';
  }
}

async function prefetchAssets() {
  const stacks = new Set(['Noto Sans Medium']);
  for (const l of layers('protomaps', namedFlavor('light'), { lang:'en' })) {
    const f = l.layout && l.layout['text-font'];
    if (Array.isArray(f) && f.every(s => typeof s === 'string')) stacks.add(f.join(','));
  }
  const ranges = ['0-255','256-511','512-767','1024-1279','4096-4351','7168-7423','7680-7935','8192-8447','11520-11775'];
  const urls = [];
  for (const s of stacks) for (const r of ranges) urls.push(GLYPHS.replace('{fontstack}', s).replace('{range}', r));
  for (const f of Object.keys(FLAVORS)) for (const s of ['.json','.png','@2x.json','@2x.png']) urls.push(SPRITE + f + s);
  await Promise.all(urls.map(u => fetch(u).then(r => r.arrayBuffer()).catch(() => {})));
}

async function download(p) {
  if (busy) return toast('Уже идёт загрузка');
  busy = p.id;
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    $('st-' + p.id).textContent = 'Скачиваю шрифты и значки...';
    await prefetchAssets();
    const r = await fetch(p.url, { cache: 'no-store' });
    if (!r.ok) throw new Error('файл ' + p.url + ' не найден, код ' + r.status);
    const total = +r.headers.get('content-length') || 0;
    const rd = r.body.getReader(), chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      chunks.push(value); got += value.length;
      $('pb-' + p.id).style.width = (total ? got / total * 100 : 50) + '%';
      $('st-' + p.id).textContent = 'Скачано ' + mb(got) + (total ? ' из ' + mb(total) : '');
    }
    const blob = new Blob(chunks, { type:'application/octet-stream' });
    await idbPut('pack:' + p.id, blob);
    await loadLocal();
    toast(p.title + ' скачано, ' + mb(blob.size));
    map.setStyle(buildStyle());
  } catch (e) {
    toast('Не удалось скачать, ' + (e.message || e), 9000);
  } finally { busy = null; renderPacks(); }
}

async function remove(p) {
  if (busy) return toast('Подожди окончания загрузки');
  await idbDel('pack:' + p.id); await loadLocal();
  toast(p.title + ' удалено'); renderPacks(); map.setStyle(buildStyle());
}

</script>
